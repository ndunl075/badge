name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run build
      - run: pnpm run test

  # The Go sidecar is a second implementation, not a binding, so it is built and
  # tested independently and checked against the same spec vectors.
  sidecar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: sidecar/go.sum
      - run: gofmt -l . | tee /dev/stderr | (! read)
        working-directory: sidecar
      - run: go vet ./...
        working-directory: sidecar
      # -race because the resolver's cache, single-flight and breaker state are
      # touched from background revalidation goroutines.
      - run: go test -race ./...
        working-directory: sidecar
      # Ed25519 is deterministic and the key is fixed, so regenerating must be a
      # no-op. A diff here means signing behaviour changed and nobody noticed.
      - run: go run ./cmd/gen-vectors && git diff --exit-code ../spec-vectors/go-signed.json
        working-directory: sidecar
